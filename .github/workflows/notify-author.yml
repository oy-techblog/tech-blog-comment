name: Notify Post Author on Comment

on:
  issue_comment:
    types: [created]

jobs:
  notify-author:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # tech-blog-comment Issue 읽기 및 댓글 삭제용

    steps:
      - name: Check if this is a bot comment (avoid infinite loop)
        if: github.actor == 'github-actions[bot]'
        run: |
          echo "Skipping bot comment to avoid infinite loop"
          exit 0

      - name: Checkout tech-blog-comment repo
        uses: actions/checkout@v4

      - name: Checkout oliveyoung-tech-blog repo
        uses: actions/checkout@v4
        with:
          repository: oy-alldev/oliveyoung-tech-blog
          token: ${{ secrets.TECH_BLOG_ACCESS_TOKEN }}
          path: tech-blog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Find author and notify
        env:
          TECH_BLOG_ACCESS_TOKEN: ${{ secrets.TECH_BLOG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { notifyAuthor } = require('./scripts/notify-author.js');
            await notifyAuthor(context, github);
